name: Integration

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Every night at 03:00 UTC
    - cron: '0 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.3
  NODE_VERSION: '22'

jobs:
  # ------------------------------------------------------------------
  # End-to-end run against a local Anvil node:
  # deploy -> load test -> charts -> monitoring demo -> dApp build -> screenshots
  #
  # The browser part only runs outside pull requests (it is the slow one; the
  # client job of ci.yml already builds the dApp on PRs). Every step is
  # time-boxed, so a stuck download fails in minutes instead of burning the
  # six hour job cap.
  # ------------------------------------------------------------------
  e2e:
    name: End-to-end (Anvil + load test + monitoring)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install the client dependencies
        working-directory: client
        run: npm ci

      - name: Start Anvil
        timeout-minutes: 2
        run: |
          ./tools/localnet.sh start
          # Bounded by the step timeout: a node that never comes up fails fast.
          until cast block-number --rpc-url http://127.0.0.1:8545 2>/dev/null; do sleep 1; done

      - name: Deploy the registry and grant the roles
        timeout-minutes: 5
        run: |
          # tools/localnet.sh is the single source of truth for the local network:
          # Anvil on 127.0.0.1:8545, Deploy + GrantRoles, client/.env.local, and
          # the publicly known Anvil test keys only.
          ./tools/localnet.sh deploy
          echo "CONTRACT=$(cat .contract-address)" >> "$GITHUB_ENV"

      - name: Load test (sequential vs parallel)
        timeout-minutes: 5
        run: |
          node tools/loadtest.js \
            --rpc http://127.0.0.1:8545 \
            --contract "$CONTRACT" \
            --registrar 0x70997970C51812dc3A010C7d01b50e0d17dc79C8 \
            --private-key 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d \
            --tx 30 --concurrency 5 --profile both \
            --out artifacts/logs/loadtest.json

      # The charts are plain SVG built with the Python standard library.
      # ImageMagick would only rasterise them, and it is not installed on the
      # runner image: an un-timed `apt-get` here is exactly what made this job
      # hang for six hours. make_charts.py keeps the SVG when `convert` is absent.
      - name: Generate the performance charts
        timeout-minutes: 3
        run: python3 tools/make_charts.py artifacts/logs/loadtest.json artifacts/logs

      - name: Monitoring demo (detection rules R1 and R2)
        timeout-minutes: 5
        run: |
          node tools/monitor_demo.mjs \
            --rpc http://127.0.0.1:8545 \
            --contract "$CONTRACT" \
            --registrar 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266 \
            --registrar-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 \
            --patient-key 0x59c6995e998f97a5a0044966f0945389dc9e86dae88c7a8412f4603b6b78690d \
            --attacker-key 0x5de4111afa1a4b94908f83103eb1f1706367c2e68ca870fc3fb9a804cdab365a \
            --out-dir artifacts/logs

      - name: Check that the telemetry stream contains no secrets
        run: |
          if grep -riE 'privatekey|private_key|0xac0974bec39a17e|0x59c6995e998f97a5|secret|password|mnemonic' artifacts/logs/telemetry.jsonl; then
            echo "::error::A secret leaked into the telemetry stream"
            exit 1
          fi
          echo "The telemetry stream is secret free."

      # The browser tail below is the slow part and only runs on `main`, the
      # nightly schedule and workflow_dispatch; ci.yml builds the client on PRs.
      - name: Build the dApp
        if: github.event_name != 'pull_request'
        working-directory: client
        run: |
          # Vite inlines these at build time, so the built app must be told where
          # the freshly deployed registry lives - otherwise every read fails with
          # "contractAddress is not configured".
          export VITE_RPC_URL=http://127.0.0.1:8545
          export VITE_CHAIN_ID=31337
          export VITE_WALLET_MODE=dev
          export VITE_CONTRACT_ADDRESS="$CONTRACT"
          export VITE_REGISTRAR_ADDRESS=0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
          npm run build

      - name: Cache the Playwright browsers
        if: github.event_name != 'pull_request'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('client/package-lock.json') }}

      - name: Serve the built dApp and capture the screenshots
        if: github.event_name != 'pull_request'
        timeout-minutes: 10
        working-directory: client
        run: |
          # The pinned devDependency; no extra registry download.
          npx playwright install --with-deps chromium
          # `vite preview` serves the production build produced above.
          # It must run from the client directory so that its root is `client`
          # and `dist/index.html` resolves.
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort \
            > ../artifacts/logs/vite-preview.log 2>&1 &
          echo $! > ../.preview.pid
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:4173 > /dev/null; then echo "preview ready"; break; fi
            sleep 1
          done
          cd ..
          node tools/screenshots.mjs \
            --url http://127.0.0.1:4173 \
            --contract "$CONTRACT" \
            --out artifacts/screenshots --strict
          kill "$(cat .preview.pid)" || true

      - name: Upload the integration artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            artifacts/logs/*.json
            artifacts/logs/*.jsonl
            artifacts/logs/*.txt
            artifacts/logs/*.log
            artifacts/logs/*.svg
            artifacts/logs/*.png
            artifacts/screenshots/*.png

      - name: Stop Anvil
        if: always()
        run: ./tools/localnet.sh stop
