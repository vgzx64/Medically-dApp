name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FOUNDRY_VERSION: v1.8.3
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.13'

jobs:
  # ------------------------------------------------------------------
  # 1. Smart contract: build, format, tests, invariants, fuzzing
  # ------------------------------------------------------------------
  contracts:
    name: Contracts (build + test + invariants)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      # Foundry 1.8 ships its own compiler, so no solc-select install is needed
      # here (Slither is the only job that needs a real solc binary).
      - name: Cache Foundry
        uses: actions/cache@v4
        with:
          path: |
            ~/.foundry
            ~/.cache/forge
          key: foundry-${{ hashFiles('foundry.toml') }}-${{ hashFiles('src/**') }}

      - name: forge fmt --check
        run: forge fmt --check

      - name: forge build
        run: forge build --sizes

      - name: forge test (unit + integration + fuzz)
        run: forge test -vv

      # The two slow steps below (a 2000-run invariant campaign and the
      # instrumented coverage build) run on `main` and on demand, not on PRs.
      - name: forge test (invariants, deeper)
        if: github.event_name != 'pull_request'
        run: forge test --match-path 'test/*invariant*' -vv --fuzz-runs 2000

      - name: forge coverage
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts/logs
          forge coverage --report summary 2>&1 | tee artifacts/logs/coverage.txt
          grep -q 'PatientConsentRegistry.sol' artifacts/logs/coverage.txt

      - name: Upload the Foundry coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundry-coverage
          path: artifacts/logs/coverage.txt
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # 2. Static analysis: Slither on the contract
  # ------------------------------------------------------------------
  slither:
    name: Slither (static analysis)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the toolchain
        run: |
          python -m pip install --upgrade pip
          pip install slither-analyzer solc-select

      - name: Install solc 0.8.37
        run: solc-select install 0.8.37 && solc-select use 0.8.37

      - name: Slither on the contract
        run: |
          mkdir -p artifacts/logs
          slither src/PatientConsentRegistry.sol \
            --exclude-dependencies \
            --json artifacts/logs/slither.json \
            --exclude timestamp,pragma
          python tools/slither_summary.py artifacts/logs/slither.json 

      - name: Fail if the contract has a High/Medium finding
        run: |
          python tools/slither_summary.py artifacts/logs/slither.json \
            --fail-on high,medium

      - name: Upload the Slither reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slither-reports
          path: artifacts/logs/slither.json

  # ------------------------------------------------------------------
  # 3. Web3 client: install, typecheck, lint, unit tests, build + supply chain
  # ------------------------------------------------------------------
  client:
    name: Client (typecheck + tests + build + supply chain)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install the dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      # The supply-chain checks share the `npm ci` above; a separate job only
      # bought a second checkout, node setup and install for the same result.
      - name: Dependency audit (moderate and above)
        run: npm audit --audit-level=moderate

      - name: License review
        run: |
          mkdir -p ../artifacts/logs
          npx --yes license-checker-rseidelsohn@4.3.0 \
            --production --json > ../artifacts/logs/licenses.json || true
          node -e "
            const fs = require('fs');
            const p = '../artifacts/logs/licenses.json';
            if (!fs.existsSync(p)) { console.log('license report missing'); process.exit(0); }
            const data = JSON.parse(fs.readFileSync(p, 'utf-8'));
            const counts = {};
            for (const name of Object.keys(data)) {
              const lic = data[name].licenses || 'UNKNOWN';
              counts[lic] = (counts[lic] || 0) + 1;
            }
            console.log(JSON.stringify(counts, null, 2));
          "

      - name: Upload the license report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: artifacts/logs/licenses.json
          if-no-files-found: ignore
