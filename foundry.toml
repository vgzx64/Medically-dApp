[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fuzz = { runs = 512 }
invariant = { runs = 256, depth = 32 }
fs_permissions = [{ access = "read-write", path = "./artifacts/logs" }]

[profile.default.fmt]
line_length = 100
tab_width = 4

[fmt]
line_length = 100
tab_width = 4
